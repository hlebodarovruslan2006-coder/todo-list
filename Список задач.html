<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Список задач</title>
<style>
:root{
  --bg:#f4f5f9;--card:#ffffff;--text:#1d2033;--muted:#7b8096;--line:#e6e8f0;
  --accent:#5b5ef4;--accent-text:#ffffff;--danger:#e5484d;--shadow:0 10px 30px rgba(30,35,80,.08);
  color-scheme:light;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#12141c;--card:#1c1f2b;--text:#eceefa;--muted:#8b90a8;--line:#2a2e3d;
    --accent:#7c7ff7;--accent-text:#12141c;--danger:#ff6b70;--shadow:0 10px 30px rgba(0,0,0,.35);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#12141c;--card:#1c1f2b;--text:#eceefa;--muted:#8b90a8;--line:#2a2e3d;
  --accent:#7c7ff7;--accent-text:#12141c;--danger:#ff6b70;--shadow:0 10px 30px rgba(0,0,0,.35);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--bg);color:var(--text);min-height:100vh;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  display:flex;justify-content:center;padding:48px 16px;
}
.app{width:100%;max-width:520px}
h1{font-size:28px;margin:0 0 4px;letter-spacing:-.02em}
.sub{color:var(--muted);margin:0 0 24px;font-size:15px}
.card{background:var(--card);border-radius:18px;box-shadow:var(--shadow);padding:16px}
form{display:flex;gap:8px}
input[type=text]{
  flex:1;min-width:0;padding:13px 14px;font-size:16px;color:var(--text);background:var(--bg);
  border:1px solid var(--line);border-radius:12px;outline:none;transition:border-color .15s,box-shadow .15s;
}
input[type=text]:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 25%,transparent)}
.add{
  padding:0 20px;border:0;border-radius:12px;background:var(--accent);color:var(--accent-text);
  font-size:16px;font-weight:600;cursor:pointer;transition:transform .1s,opacity .15s;
}
.add:hover{opacity:.9}.add:active{transform:scale(.97)}
ul{list-style:none;margin:16px 0 0;padding:0}
li{display:flex;align-items:center;gap:12px;padding:12px 4px;border-top:1px solid var(--line)}
li:first-child{border-top:0}
.check{
  appearance:none;-webkit-appearance:none;flex:none;width:24px;height:24px;margin:0;border-radius:50%;
  border:2px solid var(--muted);cursor:pointer;display:grid;place-content:center;transition:all .15s;background:transparent;
}
.check:checked{background:var(--accent);border-color:var(--accent)}
.check:checked::after{content:"";width:6px;height:11px;border:solid var(--accent-text);border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
.check:focus-visible,.del:focus-visible,.add:focus-visible,.clear:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.text{flex:1;min-width:0;word-break:break-word;font-size:16px;line-height:1.4}
li.done .text{text-decoration:line-through;color:var(--muted)}
.del{
  flex:none;width:34px;height:34px;border:0;border-radius:10px;background:transparent;color:var(--muted);
  font-size:20px;line-height:1;cursor:pointer;transition:all .15s;
}
.del:hover{background:color-mix(in srgb,var(--danger) 14%,transparent);color:var(--danger)}
.empty{text-align:center;color:var(--muted);padding:28px 0 12px;font-size:15px}
.foot{display:flex;justify-content:space-between;align-items:center;margin-top:12px;padding-top:12px;border-top:1px solid var(--line);color:var(--muted);font-size:14px}
.clear{border:0;background:transparent;color:var(--muted);font-size:14px;cursor:pointer;padding:6px 8px;border-radius:8px}
.clear:hover{color:var(--danger)}
[hidden]{display:none!important}
</style>
</head>
<body>
<main class="app">
  <h1>Список задач</h1>
  <p class="sub">Записывайте дела и отмечайте выполненные</p>
  <section class="card">
    <form id="form" autocomplete="off">
      <input type="text" id="input" placeholder="Новая задача…" maxlength="200" aria-label="Новая задача">
      <button class="add" type="submit">Добавить</button>
    </form>
    <ul id="list"></ul>
    <p class="empty" id="empty">Пока нет задач. Добавьте первую!</p>
    <div class="foot" id="foot" hidden>
      <span id="count"></span>
      <button class="clear" id="clear" type="button">Удалить выполненные</button>
    </div>
  </section>
</main>
<script>
(function(){
  var KEY="todo-list-v1";
  var tasks=load();
  var form=document.getElementById("form"),input=document.getElementById("input"),
      list=document.getElementById("list"),empty=document.getElementById("empty"),
      foot=document.getElementById("foot"),count=document.getElementById("count"),
      clearBtn=document.getElementById("clear");

  function load(){
    try{
      var raw=localStorage.getItem(KEY);
      var data=raw?JSON.parse(raw):[];
      return Array.isArray(data)?data:[];
    }catch(e){return [];}
  }
  function save(){
    try{localStorage.setItem(KEY,JSON.stringify(tasks));}catch(e){}
  }
  function plural(n){
    var m10=n%10,m100=n%100;
    if(m10===1&&m100!==11)return "задача";
    if(m10>=2&&m10<=4&&(m100<10||m100>=20))return "задачи";
    return "задач";
  }
  function render(){
    list.innerHTML="";
    tasks.forEach(function(t){
      var li=document.createElement("li");
      if(t.done)li.className="done";

      var cb=document.createElement("input");
      cb.type="checkbox";cb.className="check";cb.checked=!!t.done;
      cb.setAttribute("aria-label","Отметить выполненной");
      cb.addEventListener("change",function(){t.done=cb.checked;save();render();});

      var span=document.createElement("span");
      span.className="text";span.textContent=t.text;

      var del=document.createElement("button");
      del.type="button";del.className="del";del.textContent="×";
      del.setAttribute("aria-label","Удалить задачу");
      del.addEventListener("click",function(){
        tasks=tasks.filter(function(x){return x.id!==t.id;});
        save();render();
      });

      li.appendChild(cb);li.appendChild(span);li.appendChild(del);
      list.appendChild(li);
    });
    var left=tasks.filter(function(t){return !t.done;}).length;
    var hasDone=tasks.length-left>0;
    empty.hidden=tasks.length>0;
    foot.hidden=tasks.length===0;
    count.textContent="Осталось: "+left+" "+plural(left);
    clearBtn.hidden=!hasDone;
  }

  form.addEventListener("submit",function(e){
    e.preventDefault();
    var text=input.value.trim();
    if(!text)return;
    tasks.unshift({id:Date.now()+Math.random(),text:text,done:false});
    input.value="";
    save();render();input.focus();
  });
  clearBtn.addEventListener("click",function(){
    tasks=tasks.filter(function(t){return !t.done;});
    save();render();
  });
  render();
})();
</script>
</body>
</html>
